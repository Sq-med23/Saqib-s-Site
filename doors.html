<!DOCTYPE html>
<html>
<head>
  <style>
    html, body {
      margin: 0;
      height: 100%;
    }

    img {
      width: 100%;
      height: 100vh;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>

<img src="3rd.png" usemap="#door-map">

<map name="door-map">

    <!-- LEFT HALF = RED -->
    <area shape="rect"
          coords="0,0,960,2000"
          href="reddoor.html"
          alt="Red Door">

    <!-- RIGHT HALF = BLUE -->
    <area shape="rect"
          coords="960,0,2000,2000"
          href="bluedoor.html"
          alt="Blue Door">

</map>

</body>
</html>
